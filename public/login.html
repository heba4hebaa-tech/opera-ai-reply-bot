<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دخول الأدمن | تطبيق الرد الذكي</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body style="background: radial-gradient(circle at 20% 10%, #1d4750, transparent 40%), linear-gradient(135deg,#0d1b2a,#162a40); min-height:100vh; display:grid; place-items:center; padding:18px;">
  <div style="width:min(420px,100%);">
    <div class="center" style="color:#fff;margin-bottom:24px;">
      <div style="width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,#0f9b8e,#24c2ad);display:grid;place-items:center;font-size:30px;margin:0 auto 12px;">🤖</div>
      <h1 style="margin:0;font-size:22px;">لوحة التحكم</h1>
      <p style="color:#a9bed0;margin:4px 0 0;">تطبيق الرد الذكي للواتساب والمسنجر</p>
    </div>
    <div class="card" style="padding:28px;">
      <h3 style="margin:0 0 20px;">تسجيل الدخول</h3>
      <form id="loginForm">
        <div class="form-row">
          <label>اسم المستخدم</label>
          <input id="username" value="admin" autocomplete="username" required>
        </div>
        <div class="form-row">
          <label>كلمة المرور</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <div id="error" class="small" style="color:var(--danger);min-height:20px;margin-bottom:8px;"></div>
        <button class="btn btn-primary" style="width:100%;" type="submit">دخول الأدمن</button>
      </form>
      <div class="center small muted" style="margin-top:16px;">الافتراضي: <b>admin</b> / <b>admin123</b> — غيّره فوراً من الإعدادات</div>
    </div>
    <div class="center" style="margin-top:18px;"><a href="/" style="color:#cfe0ec;font-size:13px;">← العودة للمتجر</a></div>
  </div>
  <script src="/js/common.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const err = document.getElementById('error');
      err.textContent = '';
      const btn = e.target.querySelector('button');
      btn.disabled = true; btn.textContent = '...';
      const r = await api('/api/auth/login', { method: 'POST', body: { username: document.getElementById('username').value, password: document.getElementById('password').value } });
      btn.disabled = false; btn.textContent = 'دخول الأدمن';
      if (r.ok) { location.href = '/admin'; return; }
      err.textContent = r.error || 'تعذر تسجيل الدخول';
    });
  </script>
</body>
</html>
